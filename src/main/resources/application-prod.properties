# Database configuration
# Cloud Run mounts the Auth Proxy at /cloudsql. The driver opens that unix socket,
# so this process does not generate an RSA key pair or call the Cloud SQL Admin API.
spring.datasource.url=jdbc:postgresql://localhost/${DB_NAME}?socketFactory=org.newsclub.net.unix.AFUNIXSocketFactory$FactoryArg&socketFactoryArg=/cloudsql/${GCP_PROJECT_ID}:${GCP_REGION}:scrabble-db/.s.PGSQL.5432
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Database connection pool configuration
# Cloud Run is serverless and scales to many instances; keep pool small to avoid
# exhausting Cloud SQL's max_connections limit across all running instances.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
# A free-text batch holds no connection during provider HTTP, so pooled sockets
# sit idle for minutes. The Auth Proxy then closes them. Hikari's 30 minute
# lifetime outlives that, and the next borrow can be the Spring Session update
# at the end of the request. That write fails with a broken pipe, and the
# rollback is the message the browser shows. Ping idle sockets, drop them
# before the proxy does, and test with a real query on borrow.
spring.datasource.hikari.max-lifetime=540000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-test-query=SELECT 1

# Spring Session configuration for production
spring.session.store-type=jdbc
spring.session.timeout=77d
server.servlet.session.timeout=77d
