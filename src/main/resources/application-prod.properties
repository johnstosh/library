# Database configuration
# Cloud Run mounts the Auth Proxy at /cloudsql. The driver opens that unix socket,
# so this process does not generate an RSA key pair or call the Cloud SQL Admin API.
spring.datasource.url=jdbc:postgresql://localhost/${DB_NAME}?socketFactory=org.newsclub.net.unix.AFUNIXSocketFactory$FactoryArg&socketFactoryArg=/cloudsql/${GCP_PROJECT_ID}:${GCP_REGION}:scrabble-db/.s.PGSQL.5432
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Database connection pool configuration
# Cloud Run is serverless and scales to many instances; keep pool small to avoid
# exhausting Cloud SQL's max_connections limit across all running instances.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# Spring Session configuration for production
spring.session.store-type=jdbc
spring.session.timeout=77d
server.servlet.session.timeout=77d
