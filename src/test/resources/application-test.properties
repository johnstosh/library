# create, not create-drop. Every Spring test context shares one Testcontainers
# database. create-drop removes that schema when a context closes, which races
# the next context: ApplicationsUITest @Sql then fails with
# "relation applied does not exist" while Playwright is still starting.
# create still rebuilds the schema when a context starts and leaves it in place
# when the context closes.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.test.context.bean.override.enabled=true

# Load only base data (authorities) for all tests
# Tests that need additional data should use @Sql annotation
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-base.sql

# Page visibility settings for tests
app.show-test-data-page=true

# Disable Spring Session for tests (use in-memory sessions instead of JDBC)
spring.session.store-type=none

# Keep mocked AbeBooks tests fast; live integration tests override these.
abebooks.request-delay-ms=0
abebooks.tenth-request-delay-ms=0
abebooks.rate-limit-retries=0
abebooks.rate-limit-backoff-ms=0

# Do not copy a developer Gmail token into the test database.
app.email.seed-from-env=false
# The queue flush runs once at startup; don't keep ticking during tests.
app.email.flush-interval-ms=3600000

# Keep mocked catalog lookups fast (no delay or retry).
ydl.lookup.retries=0
ydl.lookup.backoff-ms=0
ydl.lookup.request-delay-ms=0
emu.lookup.retries=0
emu.lookup.backoff-ms=0
emu.lookup.request-delay-ms=0
acla.lookup.retries=0
acla.lookup.backoff-ms=0
acla.lookup.request-delay-ms=0
wcc.lookup.retries=0
wcc.lookup.backoff-ms=0
wcc.lookup.request-delay-ms=0
msu.lookup.retries=0
msu.lookup.backoff-ms=0
msu.lookup.request-delay-ms=0
loc.lookup.retries=0
loc.lookup.backoff-ms=0
loc.lookup.request-delay-ms=0
