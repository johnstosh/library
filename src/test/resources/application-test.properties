spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.test.context.bean.override.enabled=true

# Load only base data (authorities) for all tests
# Tests that need additional data should use @Sql annotation
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-base.sql

# Page visibility settings for tests
app.show-test-data-page=true

# Disable Spring Session for tests (use in-memory sessions instead of JDBC)
spring.session.store-type=none

# Keep mocked AbeBooks tests fast; live integration tests override these.
abebooks.request-delay-ms=0
abebooks.tenth-request-delay-ms=0
abebooks.rate-limit-retries=0
abebooks.rate-limit-backoff-ms=0

# Keep mocked ACLA tests fast (no CDN delay/retry).
acla.lookup.retries=0
acla.lookup.backoff-ms=0
acla.lookup.request-delay-ms=0
