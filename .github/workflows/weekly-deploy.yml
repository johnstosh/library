name: Weekly Cloud Run Deployment

on:
  schedule:
    # Runs every Sunday at 00:00 UTC (adjust cron as needed: minute hour day-of-month month day-of-week)
    - cron: '0 0 * * 0'
  # Optional: Also allow manual triggers via the GitHub UI
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}  # Your GCP project ID as a secret

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}  # JSON key as a secret

      # Tests must pass before deploy. deploy.sh still builds with -x test.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend into static resources
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          rm -rf src/main/resources/static/*
          mkdir -p src/main/resources/static
          cp -r frontend/dist/* src/main/resources/static/

      # Java UI tests launch Playwright's own Chromium (headless). Ubuntu's Chrome is a different binary.
      # playwrightInstall uses the test runtime classpath so driver / driver-bundle jars are included.
      - name: Install Playwright Chromium
        run: ./gradlew --no-daemon playwrightInstall

      - name: Run full test suite
        env:
          OPEN_NETWORK: "true"
        run: ./gradlew --no-daemon test

      - name: Upload Gradle test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-report
          path: build/reports/tests
          if-no-files-found: warn

      - name: Run deployment script
        run: |
          export GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
          export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          export GMAIL_TOKEN_FOR_SEND=${{ secrets.GMAIL_TOKEN_FOR_SEND }}
          export MAIL_FROM_ADDRESS=johnstosh@gmail.com
          export MAIL_SMTP_USERNAME=johnstosh@gmail.com
          export BRANCH_NAME=${{ github.ref_name }}
          chmod +x deploy.sh
          ./deploy.sh standard --scan
